[alembic]
script_location = alembic
prepend_sys_path = .
# prepend_sys_path / version_locations 구분자를 명시.
# 미지정 시 alembic 이 공백·콤마·콜론으로 legacy 분할하며 경고한다.
path_separator = os
# DB URL 은 env.py 에서 opensast.config.get_settings() 로부터 읽는다
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
