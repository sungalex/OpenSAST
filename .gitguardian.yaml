# GitGuardian / ggshield 저장소 정책
#
# 이 파일은 ggshield(CLI 및 CI 단계)가 읽는다.
# GitHub App 체크(`GitGuardian Security Checks`)는 대시보드 설정을 기준으로
# 동작하므로, 아래 예외는 대시보드
# (Settings > Sources > OpenSAST > Ignored paths) 에도 동일하게 넣어야
# PR 체크까지 조용해진다. 이 파일만으로는 로컬·CI 스캔만 정리된다.
#
# 원칙: **예외는 최소로, 사유를 반드시 남긴다.**
# 여기에 경로를 추가할 때는 "이 경로에 진짜 시크릿이 들어갈 수 있는가?" 를
# 먼저 자문한다. 답이 예이면 추가하지 않는다. 소음을 줄이는 목적은 진짜
# 유출이 소음에 묻히지 않게 하려는 것이지, 탐지 범위를 좁히려는 게 아니다.

version: 2

instance: https://dashboard.gitguardian.com

# 시크릿이 발견되면 CI 를 실패시킨다. 절대 true 로 바꾸지 않는다.
exit-zero: false

secret:
  # 로그·CI 출력에 시크릿 원문을 찍지 않는다.
  show-secrets: false

  ignored-paths:
    # --- 의도적으로 취약한 진단 대상 픽스처 -------------------------------
    # OpenSAST 는 SAST 도구다. "하드코딩된 자격증명"(MOIS SR2-4 / CWE-798)
    # 탐지 룰이 실제로 동작하는지 검증하려면 하드코딩된 자격증명이 담긴
    # 샘플 코드가 있어야 한다. 아래 파일들의 문자열은 스캐너에게 먹이려고
    # 일부러 넣은 것이며, 어떤 실환경에서도 사용되지 않는다.
    #
    # 주의: 이 파일들을 "수정"하면 탐지 룰 검증이 무력화된다.
    - tests/test_engine_integration.py
    - tests/vulnerable-samples/**
    - tests/fixtures/vulnerable-samples/**

    # --- 엔진이 만들어내는 리포트 산출물 ----------------------------------
    # 스캔 결과(SARIF/HTML/JSON)에는 탐지된 시크릿 문자열이 증거로 실린다.
    # 산출물 디렉터리는 .gitignore 대상이지만, 작업 트리 스캔 시 걸린다.
    - .opensast-work/**
    - reports/**

  ignored-matches:
    # 과거 커밋에 남아 있는 오탐. 값 자체는 비밀이 아니라 테스트 픽스처의
    # 역할 이름(접두사)이었고, 실제 비밀번호는 실행 시 무작위 생성된다.
    # 근본 원인은 tests/_credentials.py 에서 인자 리터럴을 제거해 해소했으나,
    # PR 에 포함된 옛 커밋을 다시 스캔할 때 재현되므로 SHA 로 봉인한다.
    # 참고: https://dashboard.gitguardian.com/workspace/146417/incidents/36586696
    - name: "tests/_credentials.py — 테스트 픽스처 역할 이름 (오탐, 2026-08-25 근본 수정 완료)"
      match: 113c0122731c555b6dedf82790ee13509dbc29c3ea74bb78450f49ac0da3b6b0

  # ignored-detectors 는 비워 둔다.
  # 탐지기 단위로 끄면 그 종류의 진짜 유출까지 함께 사라진다.
  # 오탐은 경로 또는 SHA 단위로만 봉인한다.
  ignored-detectors: []
